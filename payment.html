<!DOCTYPE html>
<html>
<head>
<title>Payment - WebCart</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">WebCart</div>
</header>

<div class="payment-box">
    <h2>Payment Details</h2>

    <label>Name on Card</label>
    <input type="text" id="name" placeholder="Full Name">

    <label>Card Number</label>
    <input type="text" id="card" maxlength="16" placeholder="XXXX XXXX XXXX XXXX">

    <label>Expiry Date</label>
    <input type="month" id="expiry">

    <label>CVV</label>
    <input type="password" id="cvv" maxlength="3">

    <h3>Total Amount: <span id="total"></span></h3>

    <button onclick="completePayment()">Pay Now</button>
</div>

<script src="payment.js"></script>
</body>
</html>
